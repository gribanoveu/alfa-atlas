# API keys MUST NOT go here — see docs/build-secrets.md (embedding) and Settings (LLM).

# Build-time defaults for the Jira integration. Both fields are only
# *defaults*: whatever the user types in Settings → Интеграции → Jira wins,
# and an empty field there falls back here. A fork drops or edits this
# section instead of touching any .rs file; omitting it entirely is valid.
# The access token is never configured here — it identifies a person and is
# stored encrypted per user (see infra::jira_credentials_store).
