[package]
name = "alfa-atlas"
version = "0.1.0"
description = "Alfa Atlas"
authors = ["Evgenii Gribanov"]
edition = "2021"

[lib]
name = "alfa_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
dashmap = "6"
notify = { version = "6", features = ["serde"] }
ignore = "0.4"
pulldown-cmark = "0.12"
serde_yaml = "0.9"
regex = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tauri-plugin-mcp-bridge = "0.12.0"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519"] }
spellbook = "0.4.2"
blake3 = "1.8.5"
tree-sitter = "0.26.11"
tree-sitter-java = "0.23.5"
tree-sitter-asciidoc = "0.9.0"
usearch = "2.26.0"
ureq = { version = "3.3.0", features = ["json"] }
# Already pulled in transitively by ureq (its `Response`/`Request` types are
# `http::Response`/`http::Request`) — declared directly so
# `infra::llm_providers::openai_compatible` can name `http::Response<ureq::Body>`
# in its own error-handling helper instead of duplicating status-check logic
# per call site with an inferred, unnameable type.
http = "1"
fastembed = { version = "5.17.4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
cxx = "1.0.198"
hf-hub = { version = "0.5.0", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
moka = { version = "0.12", features = ["sync"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

