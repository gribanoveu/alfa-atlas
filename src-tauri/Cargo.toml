[package]
name = "alfa-atlas"
version = "0.6.0"
description = "Alfa Atlas"
authors = ["Evgenii Gribanov"]
edition = "2021"

[lib]
name = "alfa_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
base64 = "0.22"
percent-encoding = "2"
hmac = "0.12"
md4 = "0.10"
md-5 = "0.10"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2.0.19"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
dashmap = "6"
notify = { version = "6", features = ["serde"] }
ignore = "0.4"
globset = "0.4"
pulldown-cmark = "0.12"
serde_yaml = { package = "yaml_serde", version = "0.10" }
regex = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tauri-plugin-mcp-bridge = "0.12.0"
# Платформенные бэкенды в keyring 3.x — opt-in: без фич крейт собирается с
# mock-хранилищем в памяти, которое молча теряет секрет при выходе из
# процесса. Фичи включены per-target ниже; базовое объявление оставлено,
# чтобы на неподдержанной платформе сборка не падала, а `infra::master_key`
# честно ушёл в файловый fallback (он определяет mock в рантайме).
keyring = "3"
aes-gcm = "0.10"
# Секреты в памяти: `Zeroizing`/`SecretString` затирают буфер при Drop, а
# `SecretString` вдобавок не выводится через `Debug`/`Serialize` — чтобы ключ
# нельзя было случайно уронить в лог, сообщение об ошибке или крэш-дамп.
zeroize = "1"
secrecy = "0.10"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519"] }
spellbook = "0.4.2"
blake3 = "1.8.5"
tree-sitter = "0.26.11"
tree-sitter-java = "0.23.5"
tree-sitter-asciidoc = "0.9.0"
usearch = "2.26.0"
ureq = { version = "3.3.0", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# Already pulled in transitively by ureq (its `Response`/`Request` types are
# `http::Response`/`http::Request`) — declared directly so
# `infra::llm_providers::openai_compatible` can name `http::Response<ureq::Body>`
# in its own error-handling helper instead of duplicating status-check logic
# per call site with an inferred, unnameable type.
http = "1"
# Фича `fancy-regex` у model2vec-rs форвардит не только одноимённую фичу
# tokenizers, но и `esaxx_fast`, а тот включает `esaxx-rs/cpp`, чей build.rs
# собирает C++ с жёстко зашитым `.static_crt(true)` (то есть /MT). Остальной
# MSVC-код линкуется с /MD, и сборка под Windows падает на
# `LNK2038: mismatch detected for 'RuntimeLibrary'`. Поэтому те же фичи
# tokenizers объявлены здесь напрямую, без `esaxx_fast`: он ускоряет только
# обучение Unigram-токенизатора, а здесь идёт исключительно инференс.
model2vec-rs = { version = "0.2.1", default-features = false, features = ["local-only"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex", "progressbar"] }
cxx = "1.0.198"
rusqlite = { version = "0.32", features = ["bundled"] }
moka = { version = "0.12", features = ["sync"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
similar = "2"
fs2 = "0.4"
tauri-plugin-notification = "2.3.3"
tauri-plugin-fs = "2"
# Jira REST client (blocking). Unlike the LLM/embedding clients this one does
# not go through `infra::http_agent` — gouqi is built on `reqwest`, not
# `ureq` — so the corporate-CA override is re-implemented against reqwest's
# own builder in `infra::jira_client`. Default features only: the sync client
# is all this app uses, and `async`/`cache`/`observability` would pull a
# second tokio runtime and extra machinery for nothing.
gouqi = "0.20.0"
# Declared directly only so `infra::jira_client` can hand `Jira::from_client`
# a client with a custom trust store. Feature set mirrors gouqi's own so the
# same `reqwest` build is reused rather than compiled twice.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "multipart"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.3"

# Реальные бэкенды связки ключей (см. комментарий у `keyring` выше).
# Фичи в Cargo унифицируются, поэтому здесь достаточно дообъявить фичу для
# уже объявленной зависимости.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# `sync-secret-service` — блокирующий клиент Secret Service поверх dbus (в
# приложении нет свободного async-контекста для async-варианта);
# `crypto-rust` шифрует сам dbus-транспорт без завязки на системный OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# На Windows libssh2-sys по умолчанию собирается с бэкендом WinCNG (см. его
# build.rs: без фичи `openssl-on-win32` определяется LIBSSH2_WINCNG). WinCNG не
# умеет ed25519, не читает ключи в формате OpenSSH и не поддерживает
# `libssh2_userauth_publickey_frommemory` — а libgit2 крутит этот вызов в цикле
# по EAGAIN, из-за чего clone по SSH зависал на фазе аутентификации навсегда.
# Прямая зависимость с `openssl-on-win32` переводит вендоренную сборку на
# OpenSSL — тот же бэкенд, что и на остальных платформах.
[target.'cfg(windows)'.dependencies]
libssh2-sys = { version = "0.3.2", features = ["openssl-on-win32", "vendored-openssl"] }
keyring = { version = "3", features = ["windows-native"] }
