[package]
name = "alfa-atlas"
version = "0.1.0"
description = "Alfa Atlas"
authors = ["Evgenii Gribanov"]
edition = "2021"

[lib]
name = "alfa_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
dirs = "6.0.0"
tauri-plugin-dialog = "2.7.2"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https", "ssh"] }
dashmap = "6"
notify = { version = "6", features = ["serde"] }
ignore = "0.4"
pulldown-cmark = "0.12"
serde_yaml = "0.9"
regex = "1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tauri-plugin-mcp-bridge = "0.12.0"
keyring = "3"
aes-gcm = "0.10"
rand = "0.8"
ssh-key = { version = "0.6", features = ["ed25519"] }

